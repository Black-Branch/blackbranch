# gitleaks configuration for this repository (tools/secrets-scan.sh). The default rules, plus an
# allowlist in which every entry says why its matches are not secrets. Inline `gitleaks:allow`
# comments are ignored by the scan, so this file is the only place a finding can be waved through —
# and each entry is as narrow as it can be: one rule, one path or one exact placeholder.
title = "Black Branch"

[extend]
useDefault = true

[[allowlists]]
description = "Stripe TEST-MODE event payloads recorded for the billing tests (every object livemode: false). Their idempotency keys and PaymentIntent client secrets are test-mode values that open nothing."
targetRules = ["generic-api-key"]
paths = ['''^(.*/)?web/app/api/billing/__fixtures__/stripe/[a-z_.]+\.json$''']

[[allowlists]]
description = "Placeholders in tests, written to look like secrets on purpose (a value that must never be echoed, a wrong-size key, a counting fixture, a sample setup token)."
regexTarget = "match"
regexes = [
  '''THIS-MUST-NEVER-APPEAR''',
  '''MAS_ENCRYPTION_SECRET=abcd"''',
  '''sk_test_a1b2c3d4e5f6g7h8''',
  '''"0123456789abcdef0123456789abcdef0123456789abcdef"''',
]
